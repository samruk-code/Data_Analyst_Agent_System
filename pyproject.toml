[project]
name = "data-analyst-agent"
version = "0.1.0"
description = "NL-to-SQL data analyst agent (LangGraph orchestrator, semantic layer, governance-by-construction, LangSmith evals) over a DuckDB warehouse"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langgraph>=0.2.0",
    "langsmith>=0.1.0",
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.9.0",
    "tabulate>=0.9.0",
]

[project.scripts]
data-analyst-agent = "data_analyst_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_analyst_agent"]
